interface:
  display_name: "结构化研报长图"
  short_description: "把研究机构研报结构化为中文长图，并归档 Markdown 到 Obsidian"
  default_prompt: "Use $structure-research-report in fast-processing mode by default: convert/read the report, structure it into a concise Chinese long image, anonymize the publishing institution name in all final outputs, include quick report-grounded price/valuation modules and a one-month chart for clearly supported company stocks when they can be fetched quickly, skip optional current-news browsing, Xueqiu sentiment, Futu event-pulse interpretation, and technical/funds-flow cards unless the user explicitly asks for deep/slow/full processing, save the PNG to Downloads without opening an image viewer, then archive the Markdown note into Obsidian with the generated long image embedded at the top and keyword wikilinks."
policy:
  allow_implicit_invocation: true
